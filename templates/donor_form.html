<!--donor_form.html-->
<!DOCTYPE html>
<html>
<head>
    <title>Donor Eligibility Form - RedHope</title>
</head>
<body>

<h2>Donor Eligibility Details</h2>

<form method="POST">

<label>Blood Group:</label>
<select name="blood_group" required>
<option value="">Select</option>
<option value="A+">A+</option>
<option value="A-">A-</option>
<option value="B+">B+</option>
<option value="B-">B-</option>
<option value="AB+">AB+</option>
<option value="AB-">AB-</option>
<option value="O+">O+</option>
<option value="O-">O-</option>
</select>

<br><br>

<label>Age:</label>
<input type="number" name="age" required>

<br><br>

<label>Weight (kg):</label>
<input type="number" name="weight" step="0.1">

<br><br>

<label>Hemoglobin Level:</label>
<input type="number" step="0.1" name="hemoglobin" required>

<br><br>

<label>Last Donation Date:</label>
<input type="date" name="last_donation_date">

<br><br>

<label>Medical Conditions:</label>
<input type="text" name="medical_conditions">

<br><br>

<button type="submit">Submit</button>

</form>

</body>
</html>
