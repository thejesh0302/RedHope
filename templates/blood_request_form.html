{% extends 'base.html' %}
{% block content %}
<div class="inner-page">
<div class="form-card">
    <h2>Request Blood</h2>
    <p class="form-sub">Fill in the details to find matched donors for your request.</p>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Blood Group Needed</label>
                <select name="blood_group" required>
                    <option value="">Select</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Units Required</label>
                <input type="number" name="units" min="1" placeholder="e.g. 2" required>
            </div>
        </div>
        <div class="form-group">
            <label>City</label>
            <select name="city" id="city" required>
                <option value="">Select City</option>
                {% for city in hospitals.keys() %}
                <option value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Hospital Name</label>
            <select name="hospital" id="hospital" required>
                <option value="">Select Hospital</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Urgency Level</label>
                <select name="urgency" required>
                    <option value="">Select</option>
                    <option value="Normal">Normal</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Critical">Critical</option>
                </select>
            </div>
            <div class="form-group">
                <label>Required Time</label>
                <input type="time" name="required_time" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
    </form>
</div>
</div>

<script id="hospitals-data" type="application/json">
{{ hospitals|tojson|safe }}
</script>
<script>
    const hospitalsData = JSON.parse(document.getElementById('hospitals-data').textContent);
    const citySelect = document.getElementById('city');
    const hospitalSelect = document.getElementById('hospital');

    citySelect.addEventListener('change', function() {
        const city = this.value;
        hospitalSelect.innerHTML = '<option value="">Select Hospital</option>';
        if (city && hospitalsData[city]) {
            hospitalsData[city].forEach(h => {
                const opt = document.createElement('option');
                opt.value = h.name;
                opt.textContent = h.name;
                hospitalSelect.appendChild(opt);
            });
        }
    });

    // Initial trigger
    citySelect.dispatchEvent(new Event('change'));
</script>
{% endblock %}
